# TermOS Configuration
# ====================
# Edit this file to customize your workspace environment.

# Editor
editor=nvim

# File Manager
file_manager=yazi

# Git UI
git_ui=lazygit

# System Monitor
monitor=btop

# Shell
shell=/bin/zsh

# Popup dimensions
popup_width=75%
popup_height=75%

# Max directory depth for project search
max_depth=2

# Project root directories (comma-separated)
project_roots=$HOME/Projetos,$HOME/templates,$HOME/.config/tmux,$HOME/.config/nvim,$HOME/.config/hypr

# Layout style (can be overridden per project)
default_layout=main-vertical
