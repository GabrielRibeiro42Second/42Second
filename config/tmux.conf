# Solarized Osaka - Tmux Theme
# Based on craftzdog/solarized-osaka.nvim

# -- Palette ----------------------------------

# Base
bg="#001b22"
bg_highlight="#003842"
surface="#07404d"
fg="#839496"
fg_bright="#93a1a1"
muted="#5c6972"

# Accents
blue="#268bd2"
cyan="#2aa198"
green="#859900"
yellow="#b58900"
orange="#cb4b16"
red="#dc322f"
magenta="#d33682"
violet="#6c71c4"

# -- Status -----------------------------------

set -g status "on"
set -g status-justify "left"
set -g status-position bottom
set -g status-interval 5

set -g status-style "fg=$fg,bg=$bg"

set -g status-left-length 100
set -g status-right-length 100

set -g status-left-style NONE
set -g status-right-style NONE

# Left: session name
set -g status-left "\
#[fg=$bg,bg=$cyan,bold] #S \
#[fg=$cyan,bg=$bg,nobold,nounderscore,noitalics]"

# Right: hostname + time + date
set -g status-right "\
#[fg=$fg,bg=$bg]\
#[fg=$bg,bg=$muted] %H:%M \
#[fg=$muted,bg=$surface]\
#[fg=$fg_bright,bg=$surface,bold] %d/%m \
#[fg=$surface,bg=$bg,nobold,nounderscore,noitalics]"

# -- Windows ----------------------------------

setw -g window-status-separator ""

setw -g window-status-style "NONE,fg=$muted,bg=$bg"

setw -g window-status-format "\
#[default] #I:#W \
#[fg=$bg,bg=$bg,nobold,nounderscore,noitalics]"

setw -g window-status-current-format "\
#[fg=$bg,bg=$cyan,bold] #I:#W \
#[fg=$cyan,bg=$bg,nobold,nounderscore,noitalics]"

setw -g window-status-activity-style "underscore,fg=$orange,bg=$bg"

# -- Panes ------------------------------------

set -g pane-border-style "fg=$surface"
set -g pane-active-border-style "fg=$cyan"

# -- Messages ---------------------------------

set -g message-style "fg=$cyan,bg=$bg,bold"
set -g message-command-style "fg=$cyan,bg=$bg"

# -- Mode (copy/search) ----------------------

setw -g mode-style "fg=$bg,bg=$cyan,bold"
